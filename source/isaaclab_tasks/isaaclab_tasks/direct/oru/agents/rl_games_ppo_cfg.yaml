params:
  seed: 0
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 1024
      layers: 2
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False
  load_path: ""

  config:
    name: OruAssembly
    device: cuda:0
    full_experiment_name: null
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: 64
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    # NO 'score_to_win' on purpose. rl_games treats it as an early-stop threshold:
    #   if 'score_to_win' in config and last_mean_rewards > score_to_win:
    #       print("Maximum reward achieved. Network won!"); should_exit = True
    #   (rl_games/common/a2c_common.py:1123-1132)
    # The old value 20000 came from the 15 s / 225-step era. The episode return scales
    # with the budget because the completion bonus is paid every step the seat holds
    # (40/step x up to 1350 steps), so at 90 s episodes a healthy return is already
    # tens of thousands: the run stopped at epoch 11/100 having reached 31837.
    # Removing the key disables the check entirely (the branch is guarded by
    # `if 'score_to_win' in self.config`), so training always runs max_epochs.
    max_epochs: 100
    # Checkpoint policy: keep ONLY the highest-reward weights.
    #   save_frequency: 0    -> disables the periodic "last_<name>_ep_..._rew_..." dumps
    #                           (rl_games a2c_common.py: `if self.save_freq > 0`)
    #   save_best_after: 10  -> every time the mean reward improves, <name>.pth is
    #                           overwritten (independent code path, so it still works
    #                           with save_frequency disabled)
    # Net effect: one 215 MB file (`OruAssembly.pth`) that always holds the best
    # policy so far, instead of ~9 of them. Note: at max_epochs rl_games hard-codes
    # one extra final-round `last_*` save that no config can disable - delete it
    # afterwards if disk matters (rm logs/rl_games/OruAssembly/<run>/nn/last_*.pth).
    save_best_after: 10
    save_frequency: 0
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False

          initializer:
            name: default
          regularizer:
            name: None

        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True

    player:
      deterministic: False
